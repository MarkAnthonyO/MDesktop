# window border
window.active.border.color: #e47a67
window.inactive.border.color: #d6ab5c

# ToggleKeybinds status indicator
window.active.indicator.toggled-keybind.color: #b74f3d

# window titlebar background
window.active.title.bg.color: #e47a67
window.inactive.title.bg.color: #d6ab5c

window.active.label.text.color: #251a18
window.inactive.label.text.color: #251a18
window.label.text.justify: center

# window button hover overlay
window.button.hover.bg.color: #3e231e

# window buttons
window.active.button.unpressed.image.color: #251a18
window.inactive.button.unpressed.image.color: #251a18

# menu
menu.border.color: #251a18
menu.items.bg.color: #e47a67
menu.items.text.color: #251a18
menu.items.active.bg.color: #d6ab5c
menu.items.active.text.color: #251a18
menu.separator.color: #251a18
menu.title.bg.color: #e47a67
menu.title.text.color: #251a18

# on screen display (window-cycle dialog)
osd.bg.color: #e47a67
osd.border.color: #251a18
osd.label.text.color: #251a18
osd.window-switcher.preview.border.color: #716461
